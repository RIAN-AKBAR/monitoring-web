<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal</title>
<link rel="icon" type="image/jpeg" href="">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; }
    body {
        font-family: 'Segoe UI', 'Courier New', system-ui, sans-serif;
        background: #050b18;
        color:#cbd5e1;
        min-height:100vh;
        display:flex; justify-content:center; align-items:center;
        position:relative;
    }

    .bg-layer {
        position:fixed; inset:-20px;
        background-size:cover;
        background-position:center;
        filter: blur(10px) brightness(0.22) saturate(1.3);
        transform: scale(1.1);
        animation: bgZoom 25s ease-in-out infinite alternate;
        z-index:0;
    }
    @keyframes bgZoom {
        0%   { transform: scale(1.1) translate(0,0); }
        100% { transform: scale(1.22) translate(-20px,-20px); }
    }
    .bg-overlay {
        position:fixed; inset:0;
        background:
            radial-gradient(circle at 50% 30%, var(--accent-glow-overlay, rgba(56,189,248,0.15)) 0%, transparent 60%),
            linear-gradient(180deg, rgba(5,11,24,0.7) 0%, rgba(5,11,24,0.95) 100%);
        z-index:1;
    }

    .portal {
        position:relative; z-index:2;
        display:flex; flex-direction:column;
        align-items:center; text-align:center;
        padding:30px 24px;
        max-width:560px; width:100%;
    }

    .logo-wrap {
        position:relative;
        width:130px; height:130px;
        margin-bottom:30px;
    }
    .logo-ring {
        position:absolute; inset:-10px;
        border-radius:50%;
        border:2px solid transparent;
        border-top-color: var(--accent-1, #38bdf8);
        border-right-color: var(--accent-2, #0ea5e9);
        animation: spin 1.6s linear infinite;
    }
    .logo-ring:nth-child(2) {
        inset:-20px;
        border-top-color: var(--accent-3, #7dd3fc);
        border-right-color:transparent;
        border-bottom-color: var(--accent-1, #38bdf8);
        animation: spin 2.8s linear infinite reverse;
        opacity:0.55;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .logo {
        width:100%; height:100%;
        border-radius:50%;
        object-fit:cover;
        border:3px solid var(--accent-border, rgba(56,189,248,0.5));
        box-shadow: 0 0 45px var(--accent-glow, rgba(56,189,248,0.5)), inset 0 0 25px rgba(0,0,0,0.5);
        animation: logoPulse 2.6s ease-in-out infinite;
    }
    @keyframes logoPulse {
        0%,100% { box-shadow: 0 0 45px var(--accent-glow, rgba(56,189,248,0.5)), inset 0 0 25px rgba(0,0,0,0.5); }
        50%     { box-shadow: 0 0 75px var(--accent-glow-strong, rgba(56,189,248,0.9)), inset 0 0 35px rgba(0,0,0,0.6); }
    }

    .title {
        font-size:1.7rem; font-weight:800;
        color:#f1f5f9; letter-spacing:2.5px;
        text-transform:uppercase;
        margin-bottom:6px;
        text-shadow: 0 0 25px var(--accent-glow, rgba(56,189,248,0.5));
    }
    .subtitle {
        font-size:0.72rem; color: var(--accent-3, #7dd3fc);
        letter-spacing:3.5px; text-transform:uppercase;
        margin-bottom:36px;
    }

    .progress-wrap { width:100%; max-width:400px; margin-bottom:14px; }
    .progress-labels {
        display:flex; justify-content:space-between;
        font-size:0.62rem; color:#64748b;
        letter-spacing:1.5px; text-transform:uppercase;
        margin-bottom:8px;
    }
    .progress-bar {
        height:6px; background: var(--accent-bg, rgba(56,189,248,0.1));
        border-radius:99px; overflow:hidden;
        border:1px solid var(--accent-border, rgba(56,189,248,0.5));
    }
    .progress-fill {
        height:100%; width:0%;
        background: linear-gradient(90deg, var(--accent-2, #0ea5e9), var(--accent-1, #38bdf8), var(--accent-3, #7dd3fc));
        border-radius:99px;
        box-shadow: 0 0 15px var(--accent-glow-strong, rgba(56,189,248,0.9));
        transition: width 0.35s ease;
    }
    .status-text {
        font-size:0.7rem; color:#94a3b8;
        letter-spacing:1px;
        min-height:18px;
        margin-bottom:34px;
        font-family: 'Courier New', monospace;
    }
    .status-text::after {
        content: '▊';
        animation: blink 1s step-end infinite;
        margin-left:2px;
        color: var(--accent-1, #38bdf8);
    }
    @keyframes blink { 50% { opacity:0; } }

    .enter-btn {
        display:inline-flex; align-items:center; gap:12px;
        padding:15px 40px;
        border-radius:12px;
        font-family:inherit;
        font-weight:800;
        font-size:0.92rem;
        letter-spacing:2.5px;
        text-transform:uppercase;
        text-decoration:none;
        border:1px solid var(--accent-border, rgba(56,189,248,0.5));
        background: var(--accent-btn-bg, linear-gradient(135deg, rgba(56,189,248,0.2), rgba(14,165,233,0.2)));
        color: var(--accent-3, #7dd3fc);
        cursor:pointer;
        transition: all 0.3s;
        opacity:0;
        transform: translateY(12px);
        pointer-events:none;
    }
    .enter-btn.ready {
        opacity:1; transform: translateY(0);
        pointer-events:auto;
    }
    .enter-btn:hover {
        background: linear-gradient(135deg, var(--accent-1, #38bdf8), var(--accent-2, #0ea5e9));
        color:#050b18;
        box-shadow: 0 10px 45px var(--accent-glow-strong, rgba(56,189,248,0.9));
        transform: translateY(-3px) scale(1.03);
    }
    .enter-btn .arrow { transition: transform 0.3s; font-size:1.1rem; }
    .enter-btn:hover .arrow { transform: translateX(6px); }

    .tunnel-hint {
        margin-top:26px;
        font-size:0.6rem;
        color:#475569;
        letter-spacing:2px;
        text-transform:uppercase;
        opacity:0;
        transition: opacity 0.6s;
        text-align:center;
        line-height:1.7;
    }
    .tunnel-hint.show { opacity:1; }
    .tunnel-hint a {
        color: var(--accent-3, #7dd3fc); text-decoration:none;
        border-bottom:1px dotted var(--accent-border, rgba(56,189,248,0.5));
        padding-bottom:1px;
        word-break:break-all;
    }
    .tunnel-hint a:hover { color:#e0f2fe; }
    .tunnel-hint .label {
        display:block;
        margin-bottom:4px;
        color:#334155;
        font-size:0.55rem;
    }

    .footer {
        position:fixed; bottom:18px; left:0; right:0;
        text-align:center;
        font-size:0.58rem; color:#334155;
        letter-spacing:2px; text-transform:uppercase;
        z-index:2;
        pointer-events:none;
    }
    .footer img {
        width:14px; height:14px;
        border-radius:3px; vertical-align:middle;
        margin-right:5px; opacity:0.6;
    }

    @media (max-width: 480px) {
        .title { font-size:1.25rem; letter-spacing:1.5px; }
        .logo-wrap { width:95px; height:95px; margin-bottom:24px; }
        .subtitle { font-size:0.62rem; letter-spacing:2.5px; margin-bottom:28px; }
        .enter-btn { padding:13px 30px; font-size:0.82rem; }
    }
</style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<div class="bg-overlay"></div>

<div class="portal">
    <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo-ring"></div>
        <img id="logoImg" alt="Logo" class="logo">
    </div>

    <div class="title" id="titleEl">Portal</div>
    <div class="subtitle" id="subtitleEl">Loading</div>

    <div class="progress-wrap">
        <div class="progress-labels">
            <span id="progressStage">INITIALIZING</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
    <div class="status-text" id="statusText">Menyiapkan portal...</div>

    <button class="enter-btn" id="enterBtn" onclick="enterPanel()">
        <span id="enterBtnText">Masuk Panel</span> <span class="arrow">→</span>
    </button>

    <div class="tunnel-hint" id="tunnelHint">
        <span class="label" id="tunnelLabel">Tunnel Endpoint</span>
        <a id="tunnelLink" href="#" target="_blank" rel="noopener">—</a>
    </div>
</div>

<div class="footer">
    <img id="footerLogo" alt="">
    <span id="footerText">Portal</span>
</div>

<!-- CONFIG -->
<script src="config.js"></script>

<script>
/* ============================================================
   APPLY CONFIG DARI config.js
   ============================================================ */
(function() {
    if (typeof CONFIG === 'undefined') {
        document.body.innerHTML = '<div style="color:#ef4444;padding:40px;text-align:center;font-family:sans-serif;">' +
            '<h2>⚠️ config.js tidak ditemukan</h2>' +
            '<p>Pastikan file <strong>config.js</strong> ada di folder yang sama dengan index.html</p></div>';
        return;
    }

    // Title & meta
    document.title = CONFIG.title;
    document.getElementById('titleEl').textContent      = CONFIG.title;
    document.getElementById('subtitleEl').textContent   = CONFIG.subtitle;
    document.getElementById('footerText').textContent   = CONFIG.footerText + ' · ' + new Date().getFullYear();
    document.getElementById('enterBtnText').textContent = CONFIG.enterBtnText;

    // Favicon
    const favicon = document.querySelector('link[rel="icon"]');
    if (favicon) favicon.href = CONFIG.logo;

    // og:image
    let ogImage = document.querySelector('meta[property="og:image"]');
    if (!ogImage) {
        ogImage = document.createElement('meta');
        ogImage.setAttribute('property', 'og:image');
        document.head.appendChild(ogImage);
    }
    ogImage.content = CONFIG.logo;

    // Logo
    document.getElementById('logoImg').src    = CONFIG.logo;
    document.getElementById('footerLogo').src = CONFIG.logo;

    // Background
    document.getElementById('bgLayer').style.backgroundImage = "url('" + CONFIG.background + "')";

    // Warna tema → CSS variables
    const root = document.documentElement;
    root.style.setProperty('--accent-1', CONFIG.colors.accent1);
    root.style.setProperty('--accent-2', CONFIG.colors.accent2);
    root.style.setProperty('--accent-3', CONFIG.colors.accent3);
    root.style.setProperty('--accent-border', CONFIG.colors.accentBorder);
    root.style.setProperty('--accent-bg', CONFIG.colors.accentBg);
    root.style.setProperty('--accent-glow', CONFIG.colors.accentGlow);
    root.style.setProperty('--accent-glow-strong', CONFIG.colors.accentGlowStrong);
    root.style.setProperty('--accent-btn-bg', CONFIG.colors.accentBtnBg);
    root.style.setProperty('--accent-glow-overlay', CONFIG.colors.accentGlowOverlay);

    // Tunnel
    const tunnelLink  = document.getElementById('tunnelLink');
    const tunnelLabel = document.getElementById('tunnelLabel');
    tunnelLink.href         = CONFIG.tunnelUrl;
    tunnelLink.textContent  = CONFIG.tunnelUrl;
    tunnelLabel.textContent = CONFIG.tunnelLabel;
    if (CONFIG.openInNewTab) {
        tunnelLink.target = '_blank';
        tunnelLink.rel    = 'noopener';
    } else {
        tunnelLink.removeAttribute('target');
    }

    // Loading sequence
    let stageIdx = 0;
    function runProgress() {
        const stages = CONFIG.stages;
        if (stageIdx >= stages.length) return;
        const s = stages[stageIdx];

        document.getElementById('progressFill').style.width    = s.pct + '%';
        document.getElementById('progressPercent').textContent = s.pct + '%';
        document.getElementById('progressStage').textContent   = s.stage;
        document.getElementById('statusText').textContent      = s.status;

        if (s.pct >= 100) {
            document.getElementById('enterBtn').classList.add('ready');
            document.getElementById('tunnelHint').classList.add('show');
        }

        stageIdx++;
        if (stageIdx < stages.length) {
            const delay = CONFIG.stageDelayMin +
                Math.random() * (CONFIG.stageDelayMax - CONFIG.stageDelayMin);
            setTimeout(runProgress, delay);
        }
    }

    // Enter panel
    window.enterPanel = function() {
        if (!CONFIG.tunnelUrl || CONFIG.tunnelUrl.includes('your-tunnel-url')) {
            alert('⚠️ URL tunnel belum diatur!\n\nEdit file config.js dan ganti CONFIG.tunnelUrl dengan URL tunnel Anda.');
            return;
        }
        if (CONFIG.openInNewTab) {
            window.open(CONFIG.tunnelUrl, '_blank', 'noopener');
        } else {
            window.location.href = CONFIG.tunnelUrl;
        }
    };

    setTimeout(runProgress, CONFIG.startDelay);
})();
</script>
</body>
</html>
